# Retailer Studio Shopify app configuration, live backend-only setup (SPEC 8.1, docs/DEPLOY.md).
# The backend is the app: Shopify opens application_url (the backend landing page, which starts the OAuth install) and
# the mobile app logs in with the authorization code grant against the same backend. Deploy from this folder:
#   shopify auth login
#   shopify app deploy
# The embedded web app has its own file, embedded/shopify.app.toml. Switch to it when apps/web is deployed.
#
# Keep in sync with the backend env:
#   access_scopes.scopes   = SHOPIFY_SCOPES
#   webhooks.api_version   = SHOPIFY_API_VERSION
#   auth.redirect_urls     = PUBLIC_BASE_URL + /auth/shopify/callback
#
# Webhook uri values are relative and Shopify resolves them against application_url, which is the backend here.
# Scopes use managed installation (no use_legacy_install_flow). Distribution (public, unlisted) is set in the Dev Dashboard.

client_id = "a8fb46c0913fdaa1de8c7052c1bbbca5"
name = "Retailer Studio"
application_url = "https://shopify-retailer.synquic.tech/"
embedded = false

[access_scopes]
scopes = "read_products,read_files,write_files"

[auth]
redirect_urls = ["https://shopify-retailer.synquic.tech/auth/shopify/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/shopify"

[build]
automatically_update_urls_on_dev = false
