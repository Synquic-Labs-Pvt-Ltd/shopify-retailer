# Retailer Studio Shopify app configuration for the EMBEDDED web app (SPEC 8.1, 27). Use it once apps/web is deployed:
# copy it over ../shopify.app.toml (or run `shopify app deploy` from this folder) after replacing the two hosts below.
# The live backend-only configuration is ../shopify.app.toml.
# Validated against https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration (October 2026).
#
# Hosts: the web app (apps/web) is https://shopify-retailer-ui.synquic.tech and the backend is
# https://shopify-retailer.synquic.tech. The webhook URLs and the OAuth redirect URL point straight at the backend, so the
# web app does not need to forward them. Deploy from this folder: `shopify app deploy`.
#
# Keep in sync with the backend env:
#   access_scopes.scopes   = SHOPIFY_SCOPES
#   webhooks.api_version   = SHOPIFY_API_VERSION
#   auth.redirect_urls     = PUBLIC_BASE_URL + /auth/shopify/callback
#
# Embedded app (embedded = true): Shopify opens application_url inside the Shopify admin (an iframe) and the web app
# signs in with App Bridge session tokens. The backend accepts them as bearer tokens and trades one for an offline
# access token (token exchange) the first time a shop shows up, so no redirect-based OAuth happens in the admin.
# The mobile app does not change: it still logs in with the authorization code grant against the backend, which is
# why auth.redirect_urls stays. Scopes use managed installation (no use_legacy_install_flow), so Shopify installs the
# app and grants the scopes above when the merchant opens it.
#
# The OAuth redirect URL and the webhook URLs are absolute and go to the backend. Only the app URL (what Shopify opens inside
# the admin) is the web origin.
#
# Distribution (public, unlisted) is chosen in the Dev Dashboard, not in this file.
# The first `shopify app deploy` asks whether to include this configuration; answer "Yes, always".

client_id = "a8fb46c0913fdaa1de8c7052c1bbbca5"
name = "Retailer Studio"
application_url = "https://shopify-retailer-ui.synquic.tech/"
embedded = true

[access_scopes]
scopes = "read_products,read_files,write_files"

[auth]
redirect_urls = ["https://shopify-retailer.synquic.tech/auth/shopify/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://shopify-retailer.synquic.tech/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://shopify-retailer.synquic.tech/webhooks/shopify"

[build]
automatically_update_urls_on_dev = false
